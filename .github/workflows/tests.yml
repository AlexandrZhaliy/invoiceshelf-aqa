name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run: no point finishing stale results.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start system under test (InvoiceShelf + MariaDB)
        # --wait blocks until both healthchecks pass, so the next step never hits a half-started app
        run: docker compose up -d --wait

      - name: Complete the install wizard
        run: python scripts/bootstrap_app.py

      - name: Run tests
        run: pytest

      # Everything below runs even when tests fail: that is exactly when we need the evidence.
      - name: Generate Allure report
        if: always()
        run: |
          npm install --global allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > docker-logs.txt

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v

